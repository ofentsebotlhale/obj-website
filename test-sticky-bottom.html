<!DOCTYPE html>
<html>
<head>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; }
  main { position: relative; }
  .sec {
    position: sticky;
    bottom: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .tall { height: 150vh; }
  .s1 { background: red; z-index: 1; }
  .s2 { background: green; z-index: 2; }
  .s3 { background: blue; z-index: 3; }
  .s4 { background: orange; z-index: 4; }
  .s5 { background: purple; z-index: 5; }
</style>
</head>
<body>
  <main>
    <div class="sec s1">1 (100vh)</div>
    <div class="sec s2">2 (100vh)</div>
    <div class="sec tall s3">3 (150vh)</div>
    <div class="sec s4">4 (100vh)</div>
    <div class="sec s5">5 (100vh)</div>
  </main>
</body>
</html>

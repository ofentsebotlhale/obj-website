<!DOCTYPE html>
<html>
<head>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; }
  main { /* normal flow */ }
  section {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .s1 { background: red; }
  .s2 { background: green; }
  .s3 { background: blue; }
  .s4 { background: orange; }
</style>
</head>
<body>
  <main>
    <section class="s1">1</section>
    <section class="s2">2</section>
    <section class="s3">3</section>
    <section class="s4">4</section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; }
  main { position: relative; }
  .sticky-sec {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .relative-sec {
    position: relative;
    min-height: 200vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .s1 { background: red; z-index: 1; }
  .s2 { background: green; z-index: 2; }
  .s3 { background: blue; z-index: 3; }
  .s4 { background: orange; z-index: 4; }
  .s5 { background: purple; z-index: 5; }
</style>
</head>
<body>
  <main>
    <div class="sticky-sec s1">1 (Sticky)</div>
    <div class="sticky-sec s2">2 (Sticky)</div>
    <div class="relative-sec s3">3 (Relative 200vh)</div>
    <div class="sticky-sec s4">4 (Sticky)</div>
    <div class="sticky-sec s5">5 (Sticky)</div>
  </main>
</body>
</html>
